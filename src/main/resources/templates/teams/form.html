<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: layout(pageTitle=(${teamId != null} ? 'Editar Equipo' : 'Nuevo Equipo'), page=~{::content})}">

<body>
    <div th:fragment="content">
        <div class="mb-6">
            <a href="/teams"
                class="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1 mb-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Volver a equipos
            </a>
            <h2 class="text-2xl font-bold text-gray-800" th:text="${teamId != null} ? 'Editar equipo' : 'Nuevo equipo'">
                Formulario</h2>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 max-w-2xl">
            <form th:action="${teamId != null} ? @{'/teams/' + ${teamId} + '/update'} : @{/teams}"
                th:object="${teamRequest}" method="POST" class="space-y-5">

                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre del equipo *</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>

                <div>
                    <label for="roundId" class="block text-sm font-medium text-gray-700 mb-1">Jornada *</label>
                    <select id="roundId" th:field="*{roundId}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-white">
                        <option value="" disabled selected>Seleccione una jornada</option>
                        <option th:each="round : ${rounds}" th:value="${round.id}" th:text="${round.nombre}"></option>
                    </select>
                </div>

                <div>
                    <label for="imagenUrl" class="block text-sm font-medium text-gray-700 mb-1">URL del escudo</label>
                    <div class="flex items-center gap-4">
                        <div th:if="*{imagenUrl}" class="flex-shrink-0">
                            <img th:src="*{imagenUrl}" alt="" class="w-16 h-16 rounded-lg object-cover bg-gray-100">
                        </div>
                        <div th:unless="*{imagenUrl}"
                            class="w-16 h-16 rounded-lg bg-gray-100 flex items-center justify-center text-gray-400 flex-shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <input type="text" id="imagenUrl" th:field="*{imagenUrl}"
                            placeholder="https://ejemplo.com/escudo.png"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-4">
                    <h3 class="text-lg font-semibold text-gray-800 mb-3">Jugadores del equipo</h3>
                    <div class="mb-3">
                        <input type="text" id="playerSearch" onkeyup="filterPlayers()" placeholder="Buscar jugador..."
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="bg-gray-50">
                                    <th class="text-left py-2 px-3 font-medium text-gray-600">Jugador</th>
                                    <th class="text-left py-2 px-3 font-medium text-gray-600">Rol</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="player : ${allPlayers}"
                                    class="player-row border-t border-gray-100 hover:bg-gray-50">
                                    <td class="py-2 px-3 flex items-center gap-2">
                                        <div th:if="${player.imagenUrl}"
                                            class="w-8 h-8 rounded-full bg-gray-100 flex-shrink-0 overflow-hidden">
                                            <img th:src="${player.imagenUrl}" alt="" class="w-full h-full object-cover">
                                        </div>
                                        <div th:unless="${player.imagenUrl}"
                                            class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xs font-bold flex-shrink-0">
                                            <span
                                                th:text="${#strings.substring(player.nombre, 0, 1) + #strings.substring(player.apellido, 0, 1)}">AB</span>
                                        </div>
                                        <span th:text="${player.nombre + ' ' + player.apellido}"
                                            class="text-gray-700">Jugador</span>
                                    </td>
                                    <td class="py-2 px-3">
                                        <select th:name="'roles[' + ${player.id} + ']'"
                                            class="w-full px-3 py-1.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-white text-sm">
                                            <option value="">No asignado</option>
                                            <option value="ARQUERO"
                                                th:selected="${teamRequest.roles[player.id] == 'ARQUERO'}">Arquero
                                            </option>
                                            <option value="DEFENSOR"
                                                th:selected="${teamRequest.roles[player.id] == 'DEFENSOR'}">Defensor
                                            </option>
                                            <option value="MEDIOCAMPISTA"
                                                th:selected="${teamRequest.roles[player.id] == 'MEDIOCAMPISTA'}">
                                                Mediocampista</option>
                                            <option value="DELANTERO"
                                                th:selected="${teamRequest.roles[player.id] == 'DELANTERO'}">Delantero
                                            </option>
                                        </select>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
                    <button type="submit"
                        class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
                        <span th:text="${teamId != null} ? 'Actualizar equipo' : 'Crear equipo'">Guardar</span>
                    </button>
                    <a href="/teams"
                        class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        function filterPlayers() {
            var input = document.getElementById('playerSearch');
            var filter = input.value.toLowerCase();
            var rows = document.querySelectorAll('.player-row');
            rows.forEach(function (row) {
                var nameCell = row.querySelector('td');
                var name = nameCell ? nameCell.textContent.toLowerCase() : '';
                row.style.display = name.includes(filter) ? '' : 'none';
            });
        }
    </script>
</body>

</html>
