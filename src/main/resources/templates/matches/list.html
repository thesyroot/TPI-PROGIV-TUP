<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Partidos', page=~{::content})}">
<body>
<div th:fragment="content">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Partidos</h2>
            <p class="text-gray-500 mt-1">Gestion de partidos del torneo</p>
        </div>
        <a href="/matches/new" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Nuevo partido
        </a>
    </div>

    <div class="mb-4 flex items-center gap-3">
        <label class="text-sm font-medium text-gray-600">Filtrar por jornada:</label>
        <select onchange="if(this.value) window.location='/matches?jornada='+this.value; else window.location='/matches';"
                class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm bg-white">
            <option value="">Todas las jornadas</option>
            <option th:each="r : ${rounds}" th:value="${r.id}" th:selected="${selectedJornada == r.id}"
                    th:text="${r.nombre}">Jornada</option>
        </select>
    </div>

    <div class="space-y-3">
        <div th:if="${pageData.totalElements == 0}" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center text-gray-500">
            No hay partidos registrados todavia.
        </div>
        <div th:each="match : ${pageData.content}"
             class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 hover:shadow-md transition">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-gray-500 bg-gray-100 px-2 py-1 rounded" th:text="${match.jornadaNombre}">
                    Jornada
                </span>
                <th:block th:if="${match.estado == 'FINALIZADO'}">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Finalizado</span>
                </th:block>
                <th:block th:if="${match.estado == 'EN_VIVO'}">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">En vivo</span>
                </th:block>
                <th:block th:if="${match.estado != 'FINALIZADO' and match.estado != 'EN_VIVO'}">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">Por jugarse</span>
                </th:block>
            </div>

            <div class="flex items-center justify-between py-3">
                <div class="flex items-center gap-3 w-5/12">
                    <img th:if="${match.equipoLocalImagen}" th:src="${match.equipoLocalImagen}" alt="" class="w-10 h-10 rounded-lg object-cover bg-gray-100 hidden sm:block">
                    <div th:unless="${match.equipoLocalImagen}" class="w-10 h-10 rounded-lg bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs hidden sm:flex">
                        <span th:text="${#strings.substring(match.equipoLocalNombre, 0, 2)}">AB</span>
                    </div>
                    <span class="font-medium text-gray-900 text-sm sm:text-base text-right w-full" th:text="${match.equipoLocalNombre}">Local</span>
                </div>

                <div class="flex items-center gap-2 font-bold text-xl w-2/12 justify-center">
                    <span th:text="${match.puntosLocal != null ? match.puntosLocal : '-'}" class="text-gray-800">0</span>
                    <span class="text-gray-300">-</span>
                    <span th:text="${match.puntosVisitante != null ? match.puntosVisitante : '-'}" class="text-gray-800">0</span>
                </div>

                <div class="flex items-center gap-3 w-5/12">
                    <span class="font-medium text-gray-900 text-sm sm:text-base w-full" th:text="${match.equipoVisitanteNombre}">Visitante</span>
                    <img th:if="${match.equipoVisitanteImagen}" th:src="${match.equipoVisitanteImagen}" alt="" class="w-10 h-10 rounded-lg object-cover bg-gray-100 hidden sm:block">
                    <div th:unless="${match.equipoVisitanteImagen}" class="w-10 h-10 rounded-lg bg-rose-100 flex items-center justify-center text-rose-600 font-bold text-xs hidden sm:flex">
                        <span th:text="${#strings.substring(match.equipoVisitanteNombre, 0, 2)}">AB</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                <span class="text-xs text-gray-400" th:if="${match.fecha}" th:text="${#temporals.format(match.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                <span class="text-xs text-gray-400" th:unless="${match.fecha}">Sin fecha asignada</span>
                <span class="text-xs text-green-600 font-medium" th:if="${match.estado == 'FINALIZADO' and match.resultado != null}" th:text="'Resultado: ' + ${match.resultado}">Resultado</span>
                <div class="flex items-center gap-1">
                    <a th:if="${match.estado != 'FINALIZADO'}"
                       th:href="@{'/matches/' + ${match.id} + '/finalizar'}"
                       class="p-1.5 text-green-600 hover:bg-green-50 rounded transition" title="Finalizar">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </a>
                    <a th:href="@{'/matches/' + ${match.id} + '/edit'}" class="p-1.5 text-amber-600 hover:bg-amber-50 rounded transition" title="Editar">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                    </a>
                    <button th:onclick="'openDeleteModal(\'/matches/' + ${match.id} + '/delete\')'" class="p-1.5 text-red-600 hover:bg-red-50 rounded transition" title="Eliminar">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${pageData.totalPages > 1}" class="flex items-center justify-between px-6 py-4 mt-4 bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="text-sm text-gray-500">
            <span th:text="${pageData.number * pageData.size + 1}">1</span>
            - <span th:text="${(pageData.number * pageData.size) + pageData.size > pageData.totalElements ? pageData.totalElements : (pageData.number * pageData.size) + pageData.size}">10</span>
            de <span th:text="${pageData.totalElements}">N</span>
        </div>
        <div class="flex items-center gap-1">
            <a th:if="${pageData.hasPrevious()}"
               th:href="@{/matches(page=${pageData.number - 1}, size=${pageData.size}, jornada=${selectedJornada})}"
               class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition">Anterior</a>
            <th:block th:each="i : ${#numbers.sequence(0, pageData.totalPages - 1)}">
                <a th:if="${i == pageData.number}"
                   class="px-3 py-1.5 text-sm rounded-md bg-indigo-600 text-white font-medium" th:text="${i + 1}">1</a>
                <a th:unless="${i == pageData.number}"
                   th:href="@{/matches(page=${i}, size=${pageData.size}, jornada=${selectedJornada})}"
                   class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition" th:text="${i + 1}">1</a>
            </th:block>
            <a th:if="${pageData.hasNext()}"
               th:href="@{/matches(page=${pageData.number + 1}, size=${pageData.size}, jornada=${selectedJornada})}"
               class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition">Siguiente</a>
        </div>
    </div>
</div>
</body>
</html>
