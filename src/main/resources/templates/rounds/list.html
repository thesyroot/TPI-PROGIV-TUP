<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Jornadas', page=~{::content})}">
<body>
<div th:fragment="content">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Jornadas</h2>
            <p class="text-gray-500 mt-1">Gestion de jornadas del torneo</p>
        </div>
        <a href="/rounds/new" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Nueva jornada
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div th:if="${pageData.totalElements == 0}" class="p-6 text-center text-gray-500">
            No hay jornadas registradas todavia.
        </div>
        <table class="w-full" th:unless="${pageData.totalElements == 0}">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-100">
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Jornada</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden md:table-cell">Inicio</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden md:table-cell">Fin</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden sm:table-cell">Estado</th>
                    <th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="round : ${pageData.content}" class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-amber-100 flex items-center justify-center text-amber-600 font-bold text-sm">
                                <span th:text="${round.cantidadPartidos}">0</span>
                            </div>
                            <div>
                                <p class="font-medium text-gray-900" th:text="${round.nombre}">Jornada</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 hidden md:table-cell">
                        <span class="text-gray-600" th:if="${round.inicioJornada}" th:text="${#temporals.format(round.inicioJornada, 'dd/MM/yyyy HH:mm')}">01/01/2025</span>
                        <span class="text-gray-400" th:unless="${round.inicioJornada}">-</span>
                    </td>
                    <td class="px-6 py-4 hidden md:table-cell">
                        <span class="text-gray-600" th:if="${round.finJornada}" th:text="${#temporals.format(round.finJornada, 'dd/MM/yyyy HH:mm')}">01/01/2025</span>
                        <span class="text-gray-400" th:unless="${round.finJornada}">-</span>
                    </td>
                    <td class="px-6 py-4 hidden sm:table-cell">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                              th:classappend="${round.estado == 'FINALIZADA' ? 'bg-green-100 text-green-800' : round.estado == 'EN_CURSO' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'}"
                              th:text="${round.estado == 'FINALIZADA' ? 'Finalizada' : round.estado == 'EN_CURSO' ? 'En curso' : 'Programada'}">Estado</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <a th:href="@{'/matches?jornada=' + ${round.id}}" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="Ver partidos">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </a>
                            <a th:href="@{'/rounds/' + ${round.id} + '/edit'}" class="p-2 text-amber-600 hover:bg-amber-50 rounded-lg transition" title="Editar">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </a>
                            <button th:onclick="'openDeleteModal(\'/rounds/' + ${round.id} + '/delete\')'" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition" title="Eliminar">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${pageData.totalPages > 1}" class="flex items-center justify-between px-6 py-4 border-t border-gray-100 bg-gray-50">
            <div class="text-sm text-gray-500">
                <span th:text="${pageData.number * pageData.size + 1}">1</span>
                - <span th:text="${(pageData.number * pageData.size) + pageData.size > pageData.totalElements ? pageData.totalElements : (pageData.number * pageData.size) + pageData.size}">10</span>
                de <span th:text="${pageData.totalElements}">N</span>
            </div>
            <div class="flex items-center gap-1">
                <a th:if="${pageData.hasPrevious()}" th:href="@{/rounds(page=${pageData.number - 1}, size=${pageData.size})}"
                   class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition">Anterior</a>
                <th:block th:each="i : ${#numbers.sequence(0, pageData.totalPages - 1)}">
                    <a th:if="${i == pageData.number}"
                       class="px-3 py-1.5 text-sm rounded-md bg-indigo-600 text-white font-medium" th:text="${i + 1}">1</a>
                    <a th:unless="${i == pageData.number}" th:href="@{/rounds(page=${i}, size=${pageData.size})}"
                       class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition" th:text="${i + 1}">1</a>
                </th:block>
                <a th:if="${pageData.hasNext()}" th:href="@{/rounds(page=${pageData.number + 1}, size=${pageData.size})}"
                   class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition">Siguiente</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
