<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Jugadores', page=~{::content})}">
<body>
<div th:fragment="content">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Jugadores</h2>
            <p class="text-gray-500 mt-1">Gestion de jugadores del torneo</p>
        </div>
        <a href="/players/new" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
            Nuevo jugador
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div th:if="${pageData.totalElements == 0}" class="p-6 text-center text-gray-500">
            No hay jugadores registrados todavia.
        </div>
        <table class="w-full" th:unless="${pageData.totalElements == 0}">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-100">
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Jugador</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden sm:table-cell">Equipo</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden md:table-cell">Posicion</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden lg:table-cell">Camiseta</th>
                    <th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="player : ${pageData.content}" class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img th:if="${player.imagenUrl}" th:src="${player.imagenUrl}" alt="" class="w-10 h-10 rounded-full object-cover bg-gray-100">
                            <div th:unless="${player.imagenUrl}" class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 font-bold text-sm">
                                <span th:text="${#strings.substring(player.nombre, 0, 1) + #strings.substring(player.apellido, 0, 1)}">AB</span>
                            </div>
                            <span class="font-medium text-gray-900" th:text="${player.nombre + ' ' + player.apellido}">Nombre</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-gray-600 hidden sm:table-cell">
                        <span th:if="${player.equipoNombre}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800" th:text="${player.equipoNombre}">Equipo</span>
                        <span th:unless="${player.equipoNombre}" class="text-gray-400 text-sm">Sin equipo</span>
                    </td>
                    <td class="px-6 py-4 text-gray-600 hidden md:table-cell" th:text="${player.rol}">Posicion</td>
                    <td class="px-6 py-4 text-gray-600 hidden lg:table-cell">
                        <span class="font-mono font-bold text-lg" th:text="${player.numeroCamiseta}">10</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <a th:href="@{'/players/' + ${player.id} + '/edit'}" class="p-2 text-amber-600 hover:bg-amber-50 rounded-lg transition" title="Editar">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </a>
                            <button th:onclick="'openDeleteModal(\'/players/' + ${player.id} + '/delete\')'" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition" title="Eliminar">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${pageData.totalPages > 1}" class="flex items-center justify-between px-6 py-4 border-t border-gray-100 bg-gray-50">
            <div class="text-sm text-gray-500">
                <span th:text="${pageData.number * pageData.size + 1}">1</span>
                - <span th:text="${(pageData.number * pageData.size) + pageData.size > pageData.totalElements ? pageData.totalElements : (pageData.number * pageData.size) + pageData.size}">10</span>
                de <span th:text="${pageData.totalElements}">N</span>
            </div>
            <div class="flex items-center gap-1">
                <a th:if="${pageData.hasPrevious()}" th:href="@{/players(page=${pageData.number - 1}, size=${pageData.size})}"
                   class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition">Anterior</a>
                <th:block th:each="i : ${#numbers.sequence(0, pageData.totalPages - 1)}">
                    <a th:if="${i == pageData.number}"
                       class="px-3 py-1.5 text-sm rounded-md bg-indigo-600 text-white font-medium" th:text="${i + 1}">1</a>
                    <a th:unless="${i == pageData.number}" th:href="@{/players(page=${i}, size=${pageData.size})}"
                       class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition" th:text="${i + 1}">1</a>
                </th:block>
                <a th:if="${pageData.hasNext()}" th:href="@{/players(page=${pageData.number + 1}, size=${pageData.size})}"
                   class="px-3 py-1.5 text-sm rounded-md bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 transition">Siguiente</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
