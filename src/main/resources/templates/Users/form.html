<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Registro de Usuario', page=~{::content})}">
<body>
<div th:fragment="content">

    <div class="mb-6">
        <a href="/" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1 mb-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Volver al inicio
        </a>

        <h2 class="text-2xl font-bold text-gray-800">
            Registro de usuario
        </h2>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 max-w-2xl">

        <form th:action="@{/users}"
              th:object="${userRequest}"
              method="POST"
              class="space-y-5">

            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">
                    Nombre *
                </label>

                <input type="text"
                       id="nombre"
                       th:field="*{nombre}"
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <div>
                <label for="apellido" class="block text-sm font-medium text-gray-700 mb-1">
                    Apellido *
                </label>

                <input type="text"
                       id="apellido"
                       th:field="*{apellido}"
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    Email *
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <div>
                <label for="contrasenia" class="block text-sm font-medium text-gray-700 mb-1">
                    Contraseña *
                </label>

                <input type="password"
                       id="contrasenia"
                       th:field="*{contrasenia}"
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
                <button type="submit"
                        class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
                    Registrarse
                </button>

                <a href="/"
                   class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</div>
</body>
</html>
