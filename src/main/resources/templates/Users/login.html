<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 w-full max-w-md">

        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-xl mx-auto flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Bienvenido a Prode</h1>
            <p class="text-gray-500 mt-2">Inicie sesión en su cuenta</p>
        </div>

        <div id="errorBox" class="hidden mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <div>
                <label for="contrasenia" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="contrasenia" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium shadow-sm">
                Ingresar
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            ¿No tienes cuenta? <a href="/users/new" class="text-indigo-600 font-medium hover:underline">Regístrate
                aquí</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');

            btn.disabled = true;
            btn.innerText = 'Cargando...';
            errorBox.classList.add('hidden');

            const payload = {
                email: document.getElementById('email').value,
                contrasenia: document.getElementById('contrasenia').value
            };

            try {
                // Post al endpoint REST de Spring
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    // Si el login es correcto, la Cookie HttpOnly ya fue seteada.
                    window.location.href = '/';
                } else {
                    errorBox.innerText = 'Credenciales inválidas. Intente nuevamente.';
                    errorBox.classList.remove('hidden');
                }
            } catch (error) {
                errorBox.innerText = 'Error de conexión con el servidor.';
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Ingresar';
            }
        });
    </script>
</body>

</html>
