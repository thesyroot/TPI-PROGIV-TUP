<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es" th:fragment="layout(pageTitle, page)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Prode - Usuario'">Prode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/main.js}"></script>
</head>
<body class="bg-gray-50 min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-gradient-to-b from-emerald-800 to-emerald-950 text-white flex flex-col shadow-xl">
        <div class="p-5 border-b border-emerald-700">
            <a href="/user/dashboard" class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Prode</h1>
                    <p class="text-emerald-300 text-xs">Panel de Usuario</p>
                </div>
            </a>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <div class="pb-2">
                <p class="px-4 text-xs font-semibold text-emerald-300 uppercase tracking-wider">Navegacion</p>
            </div>
            <a href="/user/dashboard" class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-all duration-200 sidebar-link" data-href="/user/dashboard">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="/user/pronosticos" class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-all duration-200 sidebar-link" data-href="/user/pronosticos">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>Pronosticos</span>
            </a>
            <a href="/user/partidos" class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-all duration-200 sidebar-link" data-href="/user/partidos">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <span>Partidos Finalizados</span>
            </a>
            <a href="/user/ranking" class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-all duration-200 sidebar-link" data-href="/user/ranking">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                <span>Ranking</span>
            </a>

            <!-- Switch to Admin -->
            <div sec:authorize="hasRole('ADMIN')" class="pt-6">
                <div class="border-t border-emerald-700 pt-4">
                    <p class="px-4 text-xs font-semibold text-emerald-300 uppercase tracking-wider mb-2">Admin</p>
                    <a href="/" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-emerald-700/50 text-white hover:bg-emerald-600/50 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <span>Panel Admin</span>
                    </a>
                </div>
            </div>
        </nav>
        <div class="p-4 border-t border-emerald-700">
            <div class="flex items-center gap-3 px-4 py-2 text-sm text-emerald-300">
                <span sec:authentication="name">email</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-h-screen">
        <!-- Top Bar -->
        <header class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-semibold text-gray-800" th:text="${pageTitle} ?: 'Dashboard'">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-gray-500">TPI - Programacion IV</span>
                    <a href="/api/users/logout" onclick="event.preventDefault(); logout()" class="text-sm text-red-500 hover:text-red-700 font-medium">Cerrar sesion</a>
                </div>
            </div>
        </header>

        <!-- Content -->
        <div class="flex-1 p-6">
            <div th:if="${success}" class="mb-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg flex items-center gap-2">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg flex items-center gap-2">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span th:text="${error}"></span>
            </div>
            <th:block th:insert="${page}"></th:block>
        </div>
    </main>

    <script>
        document.querySelectorAll('.sidebar-link').forEach(link => {
            if (link.dataset.href === window.location.pathname) {
                link.classList.add('bg-emerald-700/50', 'text-white');
            } else {
                link.classList.add('text-emerald-200', 'hover:bg-emerald-700/30', 'hover:text-white');
            }
        });

        async function logout() {
            try {
                await fetch('/api/users/logout', { method: 'POST' });
            } catch (e) {}
            window.location.href = '/users/login';
        }
    </script>
</body>
</html>
