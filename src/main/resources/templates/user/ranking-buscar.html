<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/layout :: layout(pageTitle=${pageTitle}, page=~{::content})}">
<body>
<div th:fragment="content">

  <div class="mb-2">
    <a href="/user/ranking"
       class="text-sm text-emerald-600 hover:underline flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Volver al ranking global
    </a>
  </div>

  <div th:if="${!usuariosSeleccionados.isEmpty()}"
       class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-6">

    <h3 class="text-base font-semibold text-gray-700 mb-3">
      Jugadores seleccionados
    </h3>

    <div class="flex flex-wrap gap-2">
      <span th:each="u : ${usuariosSeleccionados}"
            class="px-3 py-1 bg-emerald-100 text-emerald-800 text-sm rounded-full"
            th:text="${u.nombre + ' ' + u.apellido}">
      </span>
    </div>

    <form th:action="@{/user/ranking}" method="get" class="mt-4">

      <input th:each="id : ${userIds}"
             type="hidden"
             name="userIds"
             th:value="${id}"/>

      <button type="submit"
              class="px-5 py-2.5 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700 transition">
        Ver ranking personalizado
      </button>

    </form>

  </div>

  <!-- Buscador -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-6">
    <h3 class="text-base font-semibold text-gray-700 mb-4">
      Buscá un jugador por nombre
    </h3>

    <form th:action="@{/user/ranking/buscar}" method="get">

      <input th:each="id : ${userIds}"
             type="hidden"
             name="userIds"
             th:value="${id}"/>

      <div class="flex gap-3">

        <input type="text"
               name="nombre"
               th:value="${nombre}"
               placeholder="Escribí un nombre o apellido..."
               autofocus
               class="flex-1 px-4 py-2.5 rounded-lg border border-gray-300 text-sm
                      focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent
                      placeholder-gray-400"/>

        <button type="submit"
                class="px-5 py-2.5 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700 transition">
          Buscar
        </button>

      </div>

    </form>
  </div>

  <div th:if="${not #strings.isEmpty(nombre)}">

    <div th:if="${resultados.empty}"
         class="bg-white rounded-2xl border border-gray-200 p-8 text-center text-gray-400">

      <p class="font-medium">No se encontraron jugadores</p>
      <p class="text-sm mt-1">Probá con otro nombre.</p>

    </div>

    <div th:unless="${resultados.empty}"
         class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">

      <p class="text-sm text-gray-500 mb-4"
         th:text="${resultados.size()} + ' resultado(s) para: &quot;' + ${nombre} + '&quot;'">
      </p>

      <form th:action="@{/user/ranking/buscar}" method="get">

        <input type="hidden"
               name="nombre"
               th:value="${nombre}"/>

        <input th:each="id : ${userIds}"
               type="hidden"
               name="userIds"
               th:value="${id}"/>

        <div class="space-y-2 mb-5">

          <label th:each="u : ${resultados}"
                 class="flex items-center gap-3 px-4 py-3 rounded-lg border cursor-pointer
                        hover:border-emerald-300 hover:bg-emerald-50/50 transition-all text-sm">

            <input type="checkbox"
                   name="userIds"
                   th:value="${u.id}"
                   th:checked="${#lists.contains(userIds, u.id)}"
                   class="accent-emerald-600 w-4 h-4"/>

            <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center
                        text-emerald-700 font-bold text-xs flex-shrink-0"
                 th:text="${#strings.substring(u.nombre,0,1) + #strings.substring(u.apellido,0,1)}">
            </div>

            <span class="font-medium text-gray-800"
                  th:text="${u.nombre + ' ' + u.apellido}">
            </span>

          </label>

        </div>

        <button type="submit"
                class="px-5 py-2.5 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700 transition">
          Agregar seleccionados
        </button>

      </form>

    </div>

  </div>

</div>
</body>
</html>
