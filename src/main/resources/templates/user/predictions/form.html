<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{user/layout :: layout(pageTitle=${pageTitle}, page=~{::content})}">
<body>
<div th:fragment="content">
    <!-- Back -->
    <a href="/user/pronosticos" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-emerald-600 transition mb-6">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Volver a mis pronosticos
    </a>

    <div th:if="${match == null}" class="bg-yellow-50 border border-yellow-200 text-yellow-700 rounded-xl p-6 text-center">
        <p class="font-medium">Partido no encontrado</p>
        <p class="text-sm mt-1">Selecciona un partido desde el carrusel de partidos disponibles.</p>
        <a href="/user/pronosticos" class="inline-block mt-3 text-sm font-medium text-yellow-700 underline">Volver</a>
    </div>

    <div th:if="${match != null}" class="max-w-2xl mx-auto">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <!-- Match header -->
            <div class="bg-gradient-to-r from-emerald-700 to-emerald-600 p-6 text-white text-center">
                <p class="text-sm text-emerald-200 mb-1" th:text="${match.jornadaNombre}">Jornada</p>
                <h3 class="text-lg font-bold" th:text="${#temporals.format(match.fecha, 'EEEE dd/MM/yyyy HH:mm')}">Fecha</h3>
            </div>

            <!-- Teams display -->
            <div class="p-8">
                <div class="flex items-center justify-center gap-8 mb-8">
                    <!-- Local -->
                    <div class="text-center flex-1">
                        <div class="w-20 h-20 mx-auto mb-3 rounded-full bg-gray-50 border-2 border-gray-100 flex items-center justify-center overflow-hidden">
                            <img th:if="${match.equipoLocalImagen}" th:src="${match.equipoLocalImagen}" alt="" class="w-14 h-14 object-contain">
                            <span th:unless="${match.equipoLocalImagen}" class="text-2xl font-bold text-gray-300" th:text="${#strings.substring(match.equipoLocalNombre, 0, 2)}">LO</span>
                        </div>
                        <p class="font-semibold text-gray-800 text-lg" th:text="${match.equipoLocalNombre}">Local</p>
                    </div>

                    <!-- VS -->
                    <div class="flex-shrink-0">
                        <span class="text-2xl font-black text-gray-200">VS</span>
                    </div>

                    <!-- Visitante -->
                    <div class="text-center flex-1">
                        <div class="w-20 h-20 mx-auto mb-3 rounded-full bg-gray-50 border-2 border-gray-100 flex items-center justify-center overflow-hidden">
                            <img th:if="${match.equipoVisitanteImagen}" th:src="${match.equipoVisitanteImagen}" alt="" class="w-14 h-14 object-contain">
                            <span th:unless="${match.equipoVisitanteImagen}" class="text-2xl font-bold text-gray-300" th:text="${#strings.substring(match.equipoVisitanteNombre, 0, 2)}">VI</span>
                        </div>
                        <p class="font-semibold text-gray-800 text-lg" th:text="${match.equipoVisitanteNombre}">Visitante</p>
                    </div>
                </div>

                <!-- Score form -->
                <form th:action="${predictionId != null} ? @{'/user/pronosticos/' + ${predictionId} + '/actualizar'} : @{/user/pronosticos}" method="post" class="space-y-6">
                    <input type="hidden" name="matchId" th:value="${match.id}">

                    <div class="flex items-center justify-center gap-6">
                        <div class="text-center">
                            <label class="block text-sm font-medium text-gray-600 mb-2">Goles Local</label>
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="adjustScore('puntosLocal', -1)" class="w-10 h-10 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition text-gray-500 font-bold">-</button>
                                <input type="text" name="puntosLocal" id="puntosLocal"
                                       th:value="${predictionRequest.puntosLocal} ?: 0"
                                       inputmode="numeric" pattern="[0-9]*"
                                       class="hide-spinner w-20 text-center text-2xl font-bold text-gray-800 border-2 border-gray-200 rounded-xl py-3 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none">
                                <button type="button" onclick="adjustScore('puntosLocal', 1)" class="w-10 h-10 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition text-gray-500 font-bold">+</button>
                            </div>
                        </div>

                        <div class="text-center pt-8">
                            <span class="text-2xl font-black text-gray-200">:</span>
                        </div>

                        <div class="text-center">
                            <label class="block text-sm font-medium text-gray-600 mb-2">Goles Visitante</label>
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="adjustScore('puntosVisitante', -1)" class="w-10 h-10 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition text-gray-500 font-bold">-</button>
                                <input type="text" name="puntosVisitante" id="puntosVisitante"
                                       th:value="${predictionRequest.puntosVisitante} ?: 0"
                                       inputmode="numeric" pattern="[0-9]*"
                                       class="hide-spinner w-20 text-center text-2xl font-bold text-gray-800 border-2 border-gray-200 rounded-xl py-3 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none">
                                <button type="button" onclick="adjustScore('puntosVisitante', 1)" class="w-10 h-10 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition text-gray-500 font-bold">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center pt-4">
                        <button type="submit" class="px-8 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition shadow-lg shadow-emerald-200">
                            <span th:text="${predictionId != null} ? 'Actualizar Pronostico' : 'Guardar Pronostico'">Guardar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <style>
    .hide-spinner::-webkit-outer-spin-button,
    .hide-spinner::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    .hide-spinner { -moz-appearance: textfield; }
</style>
<script>
    function adjustScore(id, delta) {
        const input = document.getElementById(id);
        let val = parseInt(input.value) || 0;
        val = Math.max(0, Math.min(99, val + delta));
        input.value = val;
    }
    document.querySelectorAll('.hide-spinner').forEach(inp => {
        inp.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            if (this.value === '') this.value = '0';
            let v = parseInt(this.value);
            if (v > 99) this.value = '99';
        });
    });
</script>
</div>
</body>
</html>
