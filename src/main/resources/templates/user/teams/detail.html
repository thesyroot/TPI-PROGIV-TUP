<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{user/layout :: layout(pageTitle='Detalle de Equipo', page=~{::content})}">

<body>
    <div th:fragment="content">
        <div class="mb-6">
            <a href="/user/pronosticos"
                class="text-emerald-600 hover:text-emerald-800 text-sm font-medium flex items-center gap-1 mb-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Volver a predicciones
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 md:p-8">
                <div class="flex items-center gap-6">
                    <img th:if="${team.imagenUrl}" th:src="${team.imagenUrl}" alt=""
                        class="w-24 h-24 rounded-xl object-cover bg-gray-100 shadow-sm">
                    <div th:unless="${team.imagenUrl}"
                        class="w-24 h-24 rounded-xl bg-emerald-100 flex items-center justify-center shadow-sm">
                        <span class="text-2xl font-bold text-emerald-700"
                            th:text="${#strings.substring(team.nombre, 0, 2)}">AB</span>
                    </div>

                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-1" th:text="${team.nombre}">Nombre del Equipo
                        </h2>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full"
                                th:text="${team.roundNombre != null ? team.roundNombre : 'Sin Jornada'}">
                                Jornada
                            </span>
                        </div>
                        <span class="text-sm text-gray-500 block mt-2"
                            th:text="${team.cantidadJugadores + ' jugador(es)'}">0 jugadores</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-gray-800">Jugadores del equipo</h3>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div th:if="${#lists.isEmpty(team.jugadores)}" class="p-6 text-center text-gray-500">
                    No hay jugadores asignados a este equipo en esta jornada.
                </div>
                <table class="w-full" th:unless="${#lists.isEmpty(team.jugadores)}">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100">
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Jugador</th>
                            <th
                                class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase hidden sm:table-cell">
                                Pos. Principal</th>
                            <th
                                class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase hidden md:table-cell">
                                Camiseta</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr th:each="p : ${team.jugadores}" class="hover:bg-gray-50 transition">
                            <td class="px-6 py-3">
                                <div class="flex items-center gap-3">
                                    <img th:if="${p.imagenUrl}" th:src="${p.imagenUrl}" alt=""
                                        class="w-9 h-9 rounded-full object-cover bg-gray-100">
                                    <div th:unless="${p.imagenUrl}"
                                        class="w-9 h-9 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-bold text-xs">
                                        <span th:text="${#strings.substring(p.nombre, 0, 2)}">AB</span>
                                    </div>
                                    <span class="text-sm font-medium text-gray-900"
                                        th:text="${p.nombre + ' ' + p.apellido}">Nombre Completo</span>
                                </div>
                            </td>
                            <td class="px-6 py-3 text-sm text-gray-600 hidden sm:table-cell"
                                th:text="${p.posicionPopular != null ? p.posicionPopular : '-'}">Rol</td>
                            <td class="px-6 py-3 text-sm text-gray-600 hidden md:table-cell"
                                th:text="${p.numeroCamiseta}">10</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
