<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{user/layout :: layout(pageTitle=${pageTitle}, page=~{::content})}">
<body>
<div th:fragment="content">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-gray-800">
            Bienvenido, <span sec:authentication="name">Usuario</span>
        </h2>
        <p class="text-gray-500 mt-1">Panel de pronosticos deportivos</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <p class="text-sm text-gray-500 font-medium">Jornadas</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" th:text="${totalRounds}">0</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <p class="text-sm text-gray-500 font-medium">Partidos</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" th:text="${totalMatches}">0</p>
        </div>
    </div>

    <!-- Proximos partidos -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Proximos partidos</h3>
        <div th:if="${proximosPartidos.empty}" class="text-center py-8 text-gray-400">
            <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p>No hay partidos proximos</p>
        </div>
        <div th:unless="${proximosPartidos.empty}" class="space-y-3">
            <div th:each="match : ${proximosPartidos}"
                 class="flex items-center justify-between p-4 bg-gray-50 rounded-lg hover:bg-emerald-50 cursor-pointer transition border border-transparent hover:border-emerald-200"
                 onclick="openPredictionModal({id: ${match.id}, local: '${match.equipoLocalNombre}', visitante: '${match.equipoVisitanteNombre}', localImg: '${match.equipoLocalImagen}', visitanteImg: '${match.equipoVisitanteImagen}', fecha: '${#temporals.format(match.fecha, 'dd/MM/yyyy HH:mm')}', jornada: '${match.jornadaNombre}'})">
                <div class="flex items-center gap-4 flex-1">
                    <div class="text-right flex-1">
                        <span class="font-semibold text-gray-800" th:text="${match.equipoLocalNombre}">Local</span>
                    </div>
                    <div class="text-center px-3">
                        <span class="text-xs font-bold text-gray-400 uppercase">vs</span>
                    </div>
                    <div class="text-left flex-1">
                        <span class="font-semibold text-gray-800" th:text="${match.equipoVisitanteNombre}">Visitante</span>
                    </div>
                </div>
                <div class="text-right ml-4">
                    <p class="text-sm text-gray-500" th:text="${#temporals.format(match.fecha, 'dd/MM/yyyy HH:mm')}">fecha</p>
                    <p class="text-xs text-emerald-600 font-medium" th:text="${match.jornadaNombre}">jornada</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Prediction Modal -->
<div id="predictionModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl max-w-lg w-full mx-4 shadow-xl">
        <div id="modalMatchHeader" class="bg-gradient-to-r from-emerald-700 to-emerald-600 p-5 text-white text-center rounded-t-xl">
            <p id="modalJornada" class="text-sm text-emerald-200 mb-1"></p>
            <p id="modalFecha" class="text-sm"></p>
        </div>
        <div class="p-6">
            <div class="flex items-center justify-center gap-6 mb-6">
                <div class="text-center flex-1">
                    <div class="w-16 h-16 mx-auto mb-2 rounded-full bg-gray-50 border-2 border-gray-100 flex items-center justify-center overflow-hidden">
                        <img id="modalLocalImg" src="" alt="" class="w-11 h-11 object-contain">
                    </div>
                    <p id="modalLocal" class="font-semibold text-gray-800">Local</p>
                </div>
                <div class="flex-shrink-0">
                    <span class="text-lg font-black text-gray-200">VS</span>
                </div>
                <div class="text-center flex-1">
                    <div class="w-16 h-16 mx-auto mb-2 rounded-full bg-gray-50 border-2 border-gray-100 flex items-center justify-center overflow-hidden">
                        <img id="modalVisitanteImg" src="" alt="" class="w-11 h-11 object-contain">
                    </div>
                    <p id="modalVisitante" class="font-semibold text-gray-800">Visitante</p>
                </div>
            </div>

            <form id="modalPredictionForm" method="post" action="/user/pronosticos" class="space-y-4">
                <input type="hidden" name="matchId" id="modalMatchId" value="">
                <div class="flex items-center justify-center gap-4">
                    <div class="text-center">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Local</label>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="modalAdjust('modalLocalScore', -1)" class="w-8 h-8 rounded border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-500 font-bold">-</button>
                            <input type="number" name="puntosLocal" id="modalLocalScore" value="0" min="0" max="99" class="w-16 text-center text-xl font-bold text-gray-800 border-2 border-gray-200 rounded-lg py-2 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none">
                            <button type="button" onclick="modalAdjust('modalLocalScore', 1)" class="w-8 h-8 rounded border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-500 font-bold">+</button>
                        </div>
                    </div>
                    <div class="pt-6">
                        <span class="text-xl font-black text-gray-200">:</span>
                    </div>
                    <div class="text-center">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Visitante</label>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="modalAdjust('modalVisitanteScore', -1)" class="w-8 h-8 rounded border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-500 font-bold">-</button>
                            <input type="number" name="puntosVisitante" id="modalVisitanteScore" value="0" min="0" max="99" class="w-16 text-center text-xl font-bold text-gray-800 border-2 border-gray-200 rounded-lg py-2 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none">
                            <button type="button" onclick="modalAdjust('modalVisitanteScore', 1)" class="w-8 h-8 rounded border border-gray-200 flex items-center justify-center hover:bg-gray-50 text-gray-500 font-bold">+</button>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition">Cancelar</button>
                    <button type="submit" class="px-6 py-2 text-sm font-medium text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 transition">Guardar Pronostico</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openPredictionModal(data) {
        document.getElementById('modalMatchId').value = data.id;
        document.getElementById('modalLocal').textContent = data.local;
        document.getElementById('modalVisitante').textContent = data.visitante;
        document.getElementById('modalLocalImg').src = data.localImg || '';
        document.getElementById('modalVisitanteImg').src = data.visitanteImg || '';
        document.getElementById('modalFecha').textContent = data.fecha;
        document.getElementById('modalJornada').textContent = data.jornada;
        document.getElementById('modalLocalScore').value = 0;
        document.getElementById('modalVisitanteScore').value = 0;
        document.getElementById('predictionModal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('predictionModal').classList.add('hidden');
    }

    function modalAdjust(id, delta) {
        const input = document.getElementById(id);
        let val = parseInt(input.value) || 0;
        val = Math.max(0, Math.min(99, val + delta));
        input.value = val;
    }

    document.getElementById('predictionModal')?.addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
</script>
</body>
</html>
